services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bot-net

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bot-net

  bot:
    build: ./bot
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - EVOLUTION_API_URL=http://evolution-api:8080
      - REDIS_URL=redis://redis:6379
      - BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL:-http://bot:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/crm
    depends_on:
      evolution-api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - bot-net

  crm:
    build: ./crm
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/crm
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      BOT_INTERNAL_URL: http://bot:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot-net

networks:
  bot-net:

volumes:
  postgres_data:
  redis_data:
